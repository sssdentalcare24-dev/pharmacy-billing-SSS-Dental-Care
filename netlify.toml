# Netlify (primary production). Production branch: main · Branch deploys: develop (= staging)
[build]
  publish = "."

# Security headers (GitHub Pages cannot set these; Netlify can)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Strict-Transport-Security = "max-age=31536000"
    Permissions-Policy = "camera=(self), bluetooth=(self), geolocation=(), microphone=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; font-src 'self' data:; frame-src 'self' blob: data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# Always check for a new app version (the service worker keeps it fast offline)
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "no-cache"

# Developer folders are not part of the website
[[redirects]]
  from = "/tests/*"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/apps-script/*"
  to = "/index.html"
  status = 404
  force = true
